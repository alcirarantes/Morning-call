## Passo a Passo para Deploy no Vercel

### Pré-requisitos
- Conta GitHub (github.com)
- Conta Vercel (vercel.com) — gratuito para projetos estáticos, Pro (US$20/mês) para cron jobs
- Chave FRED (gratuita em fred.stlouisfed.org/docs/api/api_key.html)
- Chave Anthropic (console.anthropic.com)

### Passos

1. **Crie o repositório no GitHub**
   ```
   Nome: morning-call
   Visibilidade: Private
   ```

2. **Faça upload dos arquivos**
   - Copie toda a estrutura de pastas desta skill
   - Substitua o template HTML atual pelos placeholders

3. **Configure as variáveis de ambiente no Vercel**
   ```
   FRED_API_KEY = sua_chave_fred
   ANTHROPIC_API_KEY = sua_chave_anthropic
   CRON_SECRET = string_aleatoria_segura (ex: openssl rand -hex 32)
   ```

4. **Conecte ao Vercel**
   - New Project → Import from GitHub → morning-call
   - Framework: Other
   - Build Command: `node scripts/generate.js`
   - Output Directory: `public`
   - Deploy

5. **Plano necessário**
   - Cron Jobs requerem Vercel Pro (US$20/mês)
   - Alternativa gratuita: GitHub Actions (cron job no CI/CD, completamente gratuito)

### Alternativa 100% gratuita: GitHub Actions
```yaml
# .github/workflows/morning-call.yml
name: Morning Call Generator

on:
  schedule:
    - cron: '0 10 * * 1-5'   # 7h BRT (verão)
    - cron: '0 17 * * 1-5'   # 14h BRT (verão)
  workflow_dispatch:           # permite rodar manualmente

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node scripts/generate.js
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit e push do HTML gerado
        run: |
          git config user.email "bot@morning-call"
          git config user.name "Morning Call Bot"
          git add public/index.html
          git commit -m "Morning Call $(date '+%d/%m/%Y %H:%M')" || exit 0
          git push
```
Com GitHub Actions + Vercel hospedando o repositório estático: **custo zero**.

