## APIs Utilizadas (todas gratuitas ou de baixo custo)

### 1. Yahoo Finance (via yfinance / yahoo-finance2)
**Custo:** gratuito, sem chave necessária
**Limite:** generoso para uso diário (centenas de req)
**Cobertura:** índices, futuros, câmbio, commodities, cripto
```
npm install yahoo-finance2
```

### 2. BCB — Banco Central do Brasil (API pública oficial)
**Custo:** gratuito, sem chave necessária
**Documentação:** https://olinda.bcb.gov.br/
**Endpoints usados:**
- Selic: `https://api.bcb.gov.br/dados/serie/bcdata.sgs.432/dados/ultimos/1`
- IPCA-15: `https://api.bcb.gov.br/dados/serie/bcdata.sgs.13522/dados/ultimos/2`
- Focus (IPCA/Selic projetados): `https://olinda.bcb.gov.br/olinda/servico/Expectativas/...`
- Câmbio USD/BRL: `https://olinda.bcb.gov.br/olinda/servico/PTAX/...`

### 3. FRED API — Federal Reserve de St. Louis
**Custo:** gratuito, chave gratuita em fred.stlouisfed.org
**Cobertura:** initial claims (ICSA), continuing claims (CCSA), PCE, CPI, Payroll
**Endpoint:** `https://api.stlouisfed.org/fred/series/observations?series_id=ICSA&api_key=CHAVE&file_type=json`

### 4. CoinGecko API
**Custo:** gratuito sem chave (50 req/min), Pro ~US$129/mês para ilimitado
**Endpoint:** `https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd&include_24hr_change=true`

### 5. Claude API (Anthropic)
**Custo:** ~US$0,002-0,010 por geração completa (modelo Sonnet)
**Uso:** gerar texto analítico com base nos dados coletados
**Estimativa:** 2x/dia = ~US$0,30-0,60/mês

### 6. Web Scraping (notícias corporativas e agenda)
**Fontes:** InfoMoney, Money Times, BCB calendário, Broadcast
**Ferramenta:** `npm install cheerio node-fetch`
**Importante:** scraping light, somente para dados que não têm API

