## scripts/generate.js (script principal)
```javascript
import 'dotenv/config';
import { fetchMarketData } from '../lib/fetchMarket.js';
import { fetchBCBData } from '../lib/fetchBCB.js';
import { fetchFREDData } from '../lib/fetchFRED.js';
import { fetchCorporateNews, fetchEconomicCalendar } from '../lib/fetchNews.js';
import { generateMarketAnalysis } from '../lib/generateAnalysis.js';
import { buildHTML } from '../lib/buildHTML.js';
import { writeFileSync } from 'fs';

async function run() {
  console.log('🔄 Morning Call Generator iniciando...');
  const timestamp = new Date().toISOString();

  try {
    // 1. Coleta paralela de todos os dados de mercado
    console.log('📊 Coletando dados de mercado...');
    const [market, bcb, fred, news, agenda] = await Promise.all([
      fetchMarketData(),
      fetchBCBData(),
      fetchFREDData(process.env.FRED_API_KEY),
      fetchCorporateNews(),
      fetchEconomicCalendar(),
    ]);

    const dadosCompletos = { market, bcb, fred, news, agenda, timestamp };
    console.log('✅ Dados coletados com sucesso');

    // 2. Gera análise textual com Claude
    console.log('🤖 Gerando análise com IA...');
    const analysis = await generateMarketAnalysis(
      dadosCompletos,
      process.env.ANTHROPIC_API_KEY
    );
    console.log('✅ Análise gerada');

    // 3. Monta HTML final
    console.log('🏗️ Montando HTML...');
    const html = buildHTML({ ...dadosCompletos, analysis });

    // 4. Salva o arquivo
    writeFileSync('./public/index.html', html, 'utf8');
    console.log(`✅ Morning Call gerado: ${timestamp}`);

  } catch (error) {
    console.error('❌ Erro na geração:', error);
    process.exit(1);
  }
}

run();
```

## api/generate.js (endpoint Vercel para o cron)
```javascript
import { run } from '../scripts/generate.js';

export default async function handler(req, res) {
  // Segurança: só aceita chamada do cron do próprio Vercel
  if (req.headers.authorization !== `Bearer ${process.env.CRON_SECRET}`) {
    return res.status(401).json({ error: 'Unauthorized' });
  }

  try {
    await run();
    res.status(200).json({ ok: true, time: new Date().toISOString() });
  } catch (e) {
    res.status(500).json({ error: e.message });
  }
}
