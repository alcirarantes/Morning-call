## Quando Claude Executa Esta Skill Manualmente

Quando o usuário pede "gera o morning call de hoje" sem rodar o script automatizado,
Claude deve:

1. Usar a ferramenta `web_search` para buscar cada dado nos sites fonte
2. Montar o objeto de dados no formato esperado
3. Gerar a análise textual com base nos dados coletados
4. Atualizar o arquivo HTML substituindo os valores manualmente
5. Entregar o arquivo atualizado via `present_files`

Este é o fluxo atual que já funciona nas sessões com Alcir.
O script automatizado apenas faz isso sem intervenção humana.
