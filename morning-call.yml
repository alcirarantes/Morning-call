## lib/fetchMarket.js
```javascript
import yahooFinance from 'yahoo-finance2';

export async function fetchMarketData() {
  const symbols = {
    ibov:    '^BVSP',
    sp500f:  'ES=F',
    dow30f:  'YM=F',
    nasdaq:  'NQ=F',
    rtf:     'RTY=F',
    vix:     '^VIX',
    brent:   'BZ=F',
    wti:     'CL=F',
    gold:    'GC=F',
    silver:  'SI=F',
    copper:  'HG=F',
    dax:     '^GDAXI',
    ftse:    '^FTSE',
    cac40:   '^FCHI',
    dxy:     'DX-Y.NYB',
    eurusd:  'EURUSD=X',
    gbpusd:  'GBPUSD=X',
    usdjpy:  'JPY=X',
    t2y:     '^IRX',
    t10y:    '^TNX',
    t30y:    '^TYX',
  };

  const results = {};
  
  for (const [key, symbol] of Object.entries(symbols)) {
    try {
      const quote = await yahooFinance.quote(symbol);
      results[key] = {
        value: quote.regularMarketPrice,
        change: quote.regularMarketChange,
        changePercent: quote.regularMarketChangePercent,
        previousClose: quote.regularMarketPreviousClose,
      };
    } catch (e) {
      console.error(`Erro ao buscar ${key} (${symbol}):`, e.message);
      results[key] = { value: null, change: null, changePercent: null };
    }
  }

  return results;
}
```

## lib/fetchBCB.js
```javascript
export async function fetchBCBData() {
  const base = 'https://api.bcb.gov.br/dados/serie/bcdata.sgs';

  async function getSeries(id, n = 2) {
    const res = await fetch(`${base}.${id}/dados/ultimos/${n}?formato=json`);
    return res.json();
  }

  async function getFocus(indicador, suavizado = 'S') {
    const url = `https://olinda.bcb.gov.br/olinda/servico/Expectativas/versao/v1/odata/`
      + `ExpectativasMercadoAnuais?$top=5&$filter=Indicador eq '${indicador}'`
      + ` and Suavizado eq '${suavizado}'&$format=json&$select=Data,Mediana`;
    const res = await fetch(url);
    const data = await res.json();
    return data.value;
  }

  async function getCambio() {
    const hoje = new Date().toLocaleDateString('pt-BR').replace(/\//g, '-');
    const url = `https://olinda.bcb.gov.br/olinda/servico/PTAX/versao/v1/odata/`
      + `CotacaoDolarDia(dataCotacao=@dataCotacao)?@dataCotacao='${hoje}'`
      + `&$top=1&$format=json&$select=cotacaoVenda`;
    const res = await fetch(url);
    const data = await res.json();
    return data.value?.[0]?.cotacaoVenda ?? null;
  }

  const [selic, ipca15, focusIPCA, focusSelic, usdBRL] = await Promise.all([
    getSeries(432, 1),
    getSeries(13522, 2),
    getFocus('IPCA'),
    getFocus('Selic'),
    getCambio(),
  ]);

  return {
    selic: selic?.[0]?.valor ?? null,
    ipca15: {
      atual: ipca15?.[1]?.valor ?? null,
      anterior: ipca15?.[0]?.valor ?? null,
    },
    focusIPCA: focusIPCA?.[0]?.Mediana ?? null,
    focusSelic: focusSelic?.[0]?.Mediana ?? null,
    usdBRL,
  };
}
```

## lib/fetchFRED.js
```javascript
export async function fetchFREDData(apiKey) {
  async function getSeries(id) {
    const url = `https://api.stlouisfed.org/fred/series/observations`
      + `?series_id=${id}&api_key=${apiKey}&file_type=json`
      + `&sort_order=desc&limit=2`;
    const res = await fetch(url);
    const data = await res.json();
    return data.observations ?? [];
  }

  const [icsa, ccsa] = await Promise.all([
    getSeries('ICSA'),   // Initial Claims semanais
    getSeries('CCSA'),   // Continuing Claims
  ]);

  return {
    initialClaims: {
      atual: parseInt(icsa[0]?.value) ?? null,
      anterior: parseInt(icsa[1]?.value) ?? null,
      data: icsa[0]?.date ?? null,
    },
    continuingClaims: {
      valor: parseInt(ccsa[0]?.value) ?? null,
      data: ccsa[0]?.date ?? null,
    },
  };
}
```

## lib/fetchNews.js
```javascript
import * as cheerio from 'cheerio';

export async function fetchCorporateNews() {
  // Scraping leve de manchetes do InfoMoney B3
  const res = await fetch('https://www.infomoney.com.br/mercados/acoes-e-indices/', {
    headers: { 'User-Agent': 'Mozilla/5.0' }
  });
  const html = await res.text();
  const $ = cheerio.load(html);
  
  const headlines = [];
  $('h2.title-block a, h3.title-block a').each((i, el) => {
    if (i < 8) headlines.push($(el).text().trim());
  });

  return headlines;
}

export async function fetchEconomicCalendar() {
  // Calendário econômico do Banco Central
  const hoje = new Date().toISOString().split('T')[0];
  const url = `https://www.bcb.gov.br/api/servico/sitebcb/calendario-economico?`
    + `dataInicial=${hoje}&dataFinal=${hoje}`;
  try {
    const res = await fetch(url);
    const data = await res.json();
    return data.conteudo ?? [];
  } catch {
    return [];
  }
}
```

## lib/generateAnalysis.js
```javascript
export async function generateMarketAnalysis(dados, anthropicKey) {
  const prompt = buildPrompt(dados);
  
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': anthropicKey,
      'anthropic-version': '2023-06-01',
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 4000,
      messages: [{
        role: 'user',
        content: prompt,
      }],
    }),
  });

  const data = await res.json();
  const text = data.content[0].text;

  // Resposta deve ser JSON com os campos de texto
  try {
    const clean = text.replace(/```json|```/g, '').trim();
    return JSON.parse(clean);
  } catch {
    return null;
  }
}

function buildPrompt(dados) {
  return `Você é o assistente de análise de mercado de Alcir Arantes, estrategista de investimentos da The Hill Capital / BTG Pactual.

Com base nos dados de mercado abaixo, gere os textos analíticos do Morning Call diário.
Responda SOMENTE em JSON válido, sem markdown, sem texto fora do JSON.

DADOS DO DIA:
${JSON.stringify(dados, null, 2)}

Retorne este JSON exato:
{
  "panorama": "2 parágrafos de contexto macro do dia, tom jornalístico direto",
  "manchete": "1 frase-título do relatório, máx 120 caracteres",
  "bullets_brasil": [
    {"titulo": "...", "corpo": "..."},
    {"titulo": "...", "corpo": "..."}
  ],
  "bullets_internacional": [
    {"titulo": "...", "corpo": "..."},
    {"titulo": "...", "corpo": "..."}
  ],
  "leitura_ipca": {
    "drivers": "o que puxou o número, com dados específicos",
    "interpretacao": "o que o mercado entendeu",
    "implicacao": "impacto na Selic e curva de juros"
  },
  "sintese": {
    "juros": "impacto nos juros brasileiros",
    "bolsa": "impacto no Ibovespa e setores",
    "cambio": "perspectiva para o real",
    "catalisador": "o evento que pode mudar o cenário hoje"
  }
}

Regras:
- Nunca usar travessão (—) nem hífen duplo (--)
- Linguagem direta, sem clichês motivacionais
- Conectar todos os dados em uma narrativa coerente
- Tom: analista sênior falando com cliente sofisticado`;
}
