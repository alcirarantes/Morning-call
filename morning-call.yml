## lib/buildHTML.js — Sistema de Template

O HTML atual usa **placeholders** com a sintaxe `{{VARIAVEL}}`.
A função buildHTML lê o template e substitui cada placeholder pelos dados reais.

### Placeholders no template HTML
```
{{DATA_DIA}}           → "26"
{{DATA_META}}          → "Mar · 2026 · Quinta"
{{EDICAO}}             → "Edição 26 · Mar 2026"
{{MANCHETE}}           → texto gerado pela IA
{{PANORAMA}}           → texto gerado pela IA

{{IBOV_FECH_VAL}}      → "185.424"
{{IBOV_FECH_CHG}}      → "+1,83%"
{{IBOV_FECH_CSS}}      → "cup" ou "cdn"
{{IBOV_NOW_VAL}}       → valor em tempo real
{{USDBRL_VAL}}         → "5,2367"
{{SP500F_VAL}}         → "6.542"
{{BRENT_VAL}}          → "100,97"
{{SELIC_VAL}}          → "14,75%"
{{VIX_VAL}}            → "25,12"
{{BTC_VAL}}            → "69.380"

{{IPCA_RESULTADO}}     → "+0,44%"
{{IPCA_EXPECTATIVA}}   → "+0,29%"
{{IPCA_ANTERIOR}}      → "+0,84%"
{{IPCA_12M}}           → "3,90%"
{{IPCA_LEITURA}}       → texto gerado pela IA

{{CLAIMS_ATUAL}}       → "210 mil"
{{CLAIMS_ANTERIOR}}    → "205 mil"
{{CLAIMS_CONT}}        → "1,819 mi"

... (todos os 47 campos mapeados acima)

{{SINTESE_JUROS}}      → texto gerado pela IA
{{SINTESE_BOLSA}}      → texto gerado pela IA
{{SINTESE_CAMBIO}}     → texto gerado pela IA
{{SINTESE_CATALISADOR}} → texto gerado pela IA
```

### Exemplo da função buildHTML
```javascript
import { readFileSync } from 'fs';
import { formatBRL, formatPct, cssClass } from './utils.js';

export function buildHTML({ market, bcb, fred, analysis }) {
  let template = readFileSync('./template/morning-call.html', 'utf8');

  const today = new Date();
  const diasSemana = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const meses = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

  const replacements = {
    // Data
    DATA_DIA:   today.getDate().toString(),
    DATA_META:  `${meses[today.getMonth()]} · ${today.getFullYear()} · ${diasSemana[today.getDay()]}`,

    // Ticker
    IBOV_FECH_VAL:  market.ibov?.previousClose?.toLocaleString('pt-BR') ?? '--',
    IBOV_FECH_CHG:  formatPct(market.ibov?.changePercent),
    IBOV_FECH_CSS:  cssClass(market.ibov?.changePercent),
    USDBRL_VAL:     bcb.usdBRL?.toFixed(4) ?? '--',
    SP500F_VAL:     market.sp500f?.value?.toLocaleString('en-US') ?? '--',
    BRENT_VAL:      market.brent?.value?.toFixed(2) ?? '--',
    SELIC_VAL:      `${bcb.selic}%`,
    VIX_VAL:        market.vix?.value?.toFixed(2) ?? '--',
    BTC_VAL:        market.bitcoin?.value?.toLocaleString('en-US') ?? '--',

    // IPCA
    IPCA_RESULTADO:   `+${bcb.ipca15.atual}%`,
    IPCA_ANTERIOR:    `+${bcb.ipca15.anterior}%`,

    // Claims
    CLAIMS_ATUAL:    `${(fred.initialClaims.atual/1000).toFixed(0)} mil`,
    CLAIMS_ANTERIOR: `${(fred.initialClaims.anterior/1000).toFixed(0)} mil`,
    CLAIMS_CONT:     `${(fred.continuingClaims.valor/1000000).toFixed(3)} mi`,

    // Textos gerados por IA
    MANCHETE:           analysis?.manchete ?? '',
    PANORAMA:           analysis?.panorama ?? '',
    SINTESE_JUROS:      analysis?.sintese?.juros ?? '',
    SINTESE_BOLSA:      analysis?.sintese?.bolsa ?? '',
    SINTESE_CAMBIO:     analysis?.sintese?.cambio ?? '',
    SINTESE_CATALISADOR: analysis?.sintese?.catalisador ?? '',
  };

  for (const [key, value] of Object.entries(replacements)) {
    template = template.replaceAll(`{{${key}}}`, value ?? '--');
  }

  return template;
}
```

