# Morning Call Scraper — Skill Completa

## O Que Esta Skill Faz

Coleta todos os dados necessários para preencher o Morning Call do Alcir Arantes,
organiza por categoria, gera o HTML final com os dados do dia e salva em disco.

Funciona em dois modos:
- **Manual:** usuário pede e Claude executa agora
- **Agendado:** script Node.js roda via cron às 7h00 e 14h00

---

