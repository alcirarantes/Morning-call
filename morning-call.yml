### vercel.json (cron jobs)
```json
{
  "crons": [
    {
      "path": "/api/generate",
      "schedule": "0 10 * * 1-5"
    },
    {
      "path": "/api/generate",
      "schedule": "0 17 * * 1-5"
    }
  ]
}
```
> Nota: Vercel usa UTC. 10h UTC = 7h BRT (verão) / 11h UTC = 8h BRT (inverno).
> 17h UTC = 14h BRT (verão). Ajuste conforme horário de verão.

